<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperial Homes — Portals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--burg:#6D011A;--white:#fff;--ink:#000;--ink2:rgba(0,0,0,.66);--ink3:rgba(0,0,0,.46);--line:rgba(0,0,0,.09);--pale:rgba(0,0,0,.035);--bp:rgba(109,1,26,.08);
--nav:#000;--nav2:rgba(255,255,255,.66);--nav3:rgba(255,255,255,.4);--navl:rgba(255,255,255,.09);--navh:rgba(255,255,255,.06);--ease:cubic-bezier(.2,.7,.1,1);--r:10px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip}
body{font-family:'Quicksand',system-ui,sans-serif;background:#fff;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--burg);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .5s var(--ease)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--nav);color:#fff;z-index:50;overflow:hidden}
.sb{display:flex;align-items:center;gap:12px;height:64px;padding:0 18px;border-bottom:1px solid var(--navl)}
.sb svg{width:32px;height:32px;flex:none}
.sb strong{display:block;font-size:.8rem;letter-spacing:.3em;white-space:nowrap}
.sb span{display:block;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--nav3);font-weight:700;white-space:nowrap}
.ws{margin:14px 12px 6px;position:relative}
.ws select{width:100%;appearance:none;-webkit-appearance:none;background:var(--burg);color:#fff;border:0;border-radius:8px;padding:11px 34px 11px 40px;font-weight:700;font-size:.78rem;letter-spacing:.06em;cursor:pointer}
.ws select option{color:#000;background:#fff}
.ws .ic{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.ws .ic:first-child{left:13px;width:16px}.ws .ic:last-child{right:12px;width:14px}
.snav{flex:1;overflow-y:auto;padding:4px 10px 14px;scrollbar-width:thin;scrollbar-color:var(--navl) transparent}
.sg{margin:16px 8px 6px;font-size:.6rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--nav3);white-space:nowrap}
.sl{position:relative;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--nav2);font-weight:600;font-size:.86rem;white-space:nowrap;transition:background .3s,color .3s,transform .3s var(--ease)}
.sl:hover{background:var(--navh);color:#fff;transform:translateX(3px)}
.sl.on{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.sl.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--burg)}
.sl.on .ic{color:#fff}
.sl .n{margin-left:auto;font-size:.66rem;min-width:20px;text-align:center;padding:1px 6px;border-radius:5px;background:var(--burg);color:#fff;font-weight:700}
.sf{padding:10px;border-top:1px solid var(--navl);display:grid;gap:2px}
.sf .sl{font-size:.8rem;color:var(--nav3)}
.shell.col{grid-template-columns:72px minmax(0,1fr)}
.shell.col .sb div,.shell.col .sg,.shell.col .sl span,.shell.col .sl .n,.shell.col .ws{display:none}
.shell.col .sl{justify-content:center}
.shell.col .sb{justify-content:center;padding:0}
.shell.col [data-collapse] .ic{transform:rotate(180deg)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;height:64px;padding:0 24px;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.crumb{font-weight:700;font-size:.95rem;white-space:nowrap}
.crumb small{color:var(--ink3);font-weight:600;margin-right:6px}
.srch{margin-left:18px;flex:1;max-width:360px;position:relative}
.srch input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--pale);padding:0 12px 0 36px;outline:none;font-size:.84rem;transition:border-color .3s,background .3s}
.srch input:focus{border-color:var(--burg);background:#fff}
.srch .ic{position:absolute;left:11px;top:10px;width:16px;color:var(--ink3)}
.sp{flex:1}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:.8rem;padding:6px 10px;border-radius:6px;background:var(--pale);color:var(--ink2)}
.ib{position:relative;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);transition:background .3s}
.ib:hover{background:var(--pale);color:#000}
.ib .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--burg);color:#fff;font-size:.6rem;font-weight:700;display:grid;place-items:center}
.tu{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:8px;transition:background .3s}
.tu:hover{background:var(--pale)}
.tu b{display:block;font-size:.82rem;line-height:1.2}.tu small{font-size:.68rem;color:var(--ink3)}
.av{width:34px;height:34px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none}
.av.b{background:var(--burg)}
.mt{display:none}
.pop{position:absolute;top:56px;right:24px;width:340px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px rgba(0,0,0,.14);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .35s var(--ease)}
.pop.on{opacity:1;visibility:visible;transform:none}
.pop h4{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:.86rem}
.pop h4 button{font-size:.7rem;color:var(--burg);font-weight:700}
.nf{display:block;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.82rem}
.nf.u{background:var(--bp)}
.nf small{display:block;color:var(--ink3);font-size:.72rem}

.content{padding:28px;width:100%;max-width:1560px;margin:0 auto;flex:1}
.content>*{animation:rise .7s var(--ease) both}
.content>*:nth-child(2){animation-delay:.05s}.content>*:nth-child(3){animation-delay:.1s}.content>*:nth-child(4){animation-delay:.15s}.content>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* Components */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:12px}
.ph p{color:var(--ink3);font-size:.88rem;margin-top:2px}
.pi{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#000;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:#fff;white-space:nowrap;transition:all .3s var(--ease)}
.btn:hover{border-color:#000}
.btn.k{background:#000;color:#fff;border-color:#000}.btn.k:hover{background:var(--burg);border-color:var(--burg)}
.btn.b{background:var(--burg);color:#fff;border-color:var(--burg)}.btn.b:hover{background:#000;border-color:#000}
.btn.s{height:30px;padding:0 10px;font-size:.72rem}
.btn .ic{width:16px}
.welcome{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:28px 30px;border-radius:14px;background:#000;color:#fff;margin-bottom:18px}
.welcome::before{content:"";position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:var(--burg);opacity:.75}
.welcome::after{content:"";position:absolute;right:120px;bottom:-140px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.welcome>*{position:relative;z-index:1}
.welcome h2{font-size:1.45rem;font-weight:700}
.welcome p{color:rgba(255,255,255,.7);margin-top:4px;max-width:60ch}
.welcome .btn{background:#fff;color:#000;border-color:#fff}.welcome .btn:hover{background:var(--burg);color:#fff;border-color:var(--burg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat{position:relative;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:#fff;transition:transform .4s var(--ease),box-shadow .4s,border-color .4s}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.08);border-color:rgba(0,0,0,.2)}
.stat .lb{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding-right:44px}
.stat .v{font-size:1.65rem;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.stat .h{font-size:.76rem;color:var(--ink3)}
.stat .h b{color:var(--burg)}
.stat .si{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--pale)}
.stat.t .si{background:var(--burg);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.stack{display:grid;gap:18px}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ch h3{font-size:.92rem;font-weight:700;flex:1}
.ch .ic{color:var(--burg)}
.cb{padding:18px}
.cb.f{padding:0}
.tabsx{display:flex;gap:4px;padding:4px;border-radius:9px;background:var(--pale);width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.tabsx button{padding:7px 14px;border-radius:7px;font-size:.78rem;font-weight:700;color:var(--ink2);white-space:nowrap}
.tabsx button.on{background:#fff;color:#000;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:11px 18px;background:var(--pale);white-space:nowrap}
td{padding:12px 18px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .25s}
tbody tr:hover{background:var(--pale)}
td small{display:block;color:var(--ink3);font-size:.74rem}
.cell{display:flex;align-items:center;gap:12px;min-width:200px}
.cell img{width:48px;height:40px;border-radius:6px;object-fit:cover;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:20px;white-space:nowrap;background:var(--pale);color:var(--ink2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:#000;color:#fff}
.pill.w{background:var(--bp);color:var(--burg)}
.pill.bd{background:var(--burg);color:#fff}
.li{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);transition:background .25s}
.li:first-child{border-top:0}
.li:hover{background:var(--pale)}
.li .g{flex:1;min-width:0}
.li b{display:block;font-size:.86rem}.li small{color:var(--ink3);font-size:.76rem}
.lic{width:36px;height:36px;border-radius:10px;background:var(--bp);color:var(--burg);display:grid;place-items:center;flex:none}
.dt{flex:none;display:grid;justify-items:center;width:54px;padding:6px 0;border-radius:10px;background:#000;color:#fff;line-height:1.1}
.dt b{font-size:1.2rem}.dt small{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.chart{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:16px}
.cc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:#000;height:0;transition:height 1.1s var(--ease);position:relative}
.cc:last-child .bar{background:var(--burg)}
.bar:hover::after{content:attr(data-v);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:5px;background:#000;color:#fff;font-size:.66rem;font-weight:700;white-space:nowrap}
.cc small{font-size:.64rem;color:var(--ink3);font-weight:700}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.dn{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.dn::after{content:attr(data-c);position:absolute;inset:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem;white-space:pre;text-align:center;line-height:1.2}
.lg{display:grid;gap:8px;font-size:.8rem;font-weight:600}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.prog{height:6px;border-radius:4px;background:var(--pale);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--burg);width:0;transition:width 1.2s var(--ease)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.lc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;transition:transform .45s var(--ease),box-shadow .45s}
.lc:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.1)}
.lc .im{aspect-ratio:16/11;overflow:hidden;position:relative}
.lc img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.lc:hover img{transform:scale(1.06)}
.lc .im .pill{position:absolute;left:10px;top:10px}
.lc .bd{padding:14px 16px}
.lc b{display:block}.lc small{color:var(--ink3);font-size:.78rem}
.lc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:700}
.kan{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--pale);border-radius:var(--r);padding:12px}
.lane h4{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin:2px 4px 12px}
.lane h4 span{background:#000;color:#fff;border-radius:5px;padding:0 7px}
.lane:last-child h4 span{background:var(--burg)}
.deal{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px;margin-bottom:10px;animation:rise .5s var(--ease) both}
.deal b{display:block;font-size:.86rem}.deal small{display:block;color:var(--ink3);font-size:.74rem}
.deal .r{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:700;font-size:.84rem}
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);height:min(640px,72vh)}
.th{border-right:1px solid var(--line);overflow-y:auto}
.th button{display:flex;gap:12px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);transition:background .25s}
.th button:hover{background:var(--pale)}
.th button.on{background:var(--bp)}
.th b{display:block;font-size:.84rem}.th small{display:block;color:var(--ink3);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.cv{display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--pale)}
.m{max-width:72%;padding:10px 14px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid var(--line);font-size:.86rem;animation:rise .4s var(--ease) both}
.m.me{align-self:flex-end;background:#000;color:#fff;border-color:#000;border-radius:14px 14px 4px 14px}
.m small{display:block;font-size:.66rem;opacity:.6;margin-top:4px}
.cmp{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.cmp input{flex:1;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;outline:none}
.cmp input:focus{border-color:var(--burg)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fd label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.fd input,.fd select,.fd textarea{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;outline:none;background:#fff;transition:border-color .3s}
.fd textarea{height:96px;padding:10px 12px;resize:vertical}
.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:var(--burg)}
.fd.w{grid-column:1/-1}
.tg{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.tg:first-child{border-top:0}
.tg small{display:block;color:var(--ink3);font-size:.76rem}
.sw{width:42px;height:24px;border-radius:12px;background:rgba(0,0,0,.18);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .35s var(--ease)}
.sw[aria-checked="true"]{background:var(--burg)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
.toast{position:fixed;right:24px;bottom:24px;z-index:90;background:#000;color:#fff;padding:14px 18px;border-radius:10px;border-left:4px solid var(--burg);font-size:.84rem;transform:translateY(160%);transition:transform .5s var(--ease);max-width:calc(100vw - 32px);box-shadow:0 18px 40px rgba(0,0,0,.25)}
.toast.on{transform:none}
.sim{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:6px;border:1px dashed rgba(0,0,0,.25);color:var(--ink3)}

.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:18px}
.live{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.live b{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.live small{color:var(--ink3)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--burg);align-self:center;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(109,1,26,.5)}70%{box-shadow:0 0 0 12px rgba(109,1,26,0)}100%{box-shadow:0 0 0 0 rgba(109,1,26,0)}}
.spark{display:block;width:100%;height:70px;margin-top:12px}
.rg{display:grid;grid-template-columns:minmax(80px,130px) 1fr 40px;gap:10px;align-items:center;font-size:.8rem;font-weight:600;margin-bottom:9px}
.rg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rg .prog{margin:0}.rg b{text-align:right}
.sx{display:none;position:absolute;top:14px;right:12px;width:36px;height:36px;border-radius:8px;color:#fff;place-items:center;background:var(--navh);z-index:2}
@media (max-width:1180px){.g3{grid-template-columns:1fr 1fr}.g3>:first-child{grid-column:1/-1}}
@media (max-width:760px){.g3{grid-template-columns:1fr}}
@media (max-width:980px){.sx{display:grid}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.rvd{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:#fff;z-index:71;transform:translateX(102%);transition:transform .7s var(--ease);display:flex;flex-direction:column;box-shadow:-30px 0 60px rgba(0,0,0,.15)}
.rv-open .scrim{opacity:1;visibility:visible}.rv-open .rvd{transform:none}
.rvh{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.rvh h3{flex:1;font-size:1.05rem;line-height:1.3}
.rvb{flex:1;overflow-y:auto;padding:20px}
.rvg{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:140px 140px;gap:6px;border-radius:10px;overflow:hidden;margin-bottom:18px}
.rvg img{width:100%;height:100%;object-fit:cover}.rvg img:first-child{grid-row:span 2}
.kvg{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 14px}
.kvg div{background:#fff;padding:12px 14px}.kvg small{display:block;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.h5{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:22px 0 8px}
.ck{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.86rem;width:100%;text-align:left;font-weight:600}
.ck i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;border:1.5px solid rgba(0,0,0,.2);flex:none}
.ck i .ic{width:14px}
.ck.ok i{background:#000;border-color:#000;color:#fff}
.ck em{margin-left:auto;font-style:normal;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--burg)}
.ck.ok em{color:var(--ink3)}
.tmpl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tmpl button{font-size:.74rem;font-weight:600;padding:6px 11px;border-radius:20px;border:1px solid var(--line);transition:border-color .3s,color .3s;text-align:left}
.tmpl button:hover{border-color:var(--burg);color:var(--burg)}
.rvm{display:flex;flex-direction:column;gap:8px;background:var(--pale);border-radius:10px;padding:14px;min-height:110px;max-height:280px;overflow-y:auto}
.rvf{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:600px){.rvg{grid-template-rows:110px 110px}.kvg{grid-template-columns:1fr}}
@media (max-width:1180px){.grid{grid-template-columns:1fr}.clock,.sim{display:none}}
@media (max-width:980px){
  .shell,.shell.col{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;transform:translateX(-102%);transition:transform .5s var(--ease)}
  .shell.open .side{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .shell.open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
  .mt{display:grid}
  [data-collapse]{display:none!important}
  .top{padding:0 12px}.content{padding:18px 14px 50px}
  .tu div{display:none}
  .g2,.form{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr;height:auto}
  .th{max-height:220px;border-right:0;border-bottom:1px solid var(--line)}
  .msgs{min-height:340px}
}
@media (max-width:600px){.srch{display:none}.crumb small{display:none}.welcome{padding:22px}.stat .v{font-size:1.4rem}.pop{right:12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

let live = 148; const hist = Array.from({length:24}, (_, i) => 118 + Math.round(Math.sin(i / 3) * 14 + i * 1.2));
const meters = rows => { const mx = Math.max(...rows.map(r => r[1])); return rows.map(([n, v]) => `<div class="rg"><span>${n}</span><div class="prog"><i data-w="${Math.round(v / mx * 100)}"></i></div><b>${v}%</b></div>`).join(''); };
const spark = () => { const mx = Math.max(...hist), mn = Math.min(...hist), pts = hist.map((v, i) => `${(i / (hist.length - 1) * 300).toFixed(1)},${(56 - (v - mn) / (mx - mn || 1) * 48).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 300 60" class="spark" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,60 ${pts} 300,60" fill="rgba(109,1,26,.08)"/><polyline points="${pts}" fill="none" stroke="#6D011A" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`; };

/* ================= Shell / router ================= */
let role = 'admin', page = 'dashboard';
const shell = $('#shell');
function renderNav() {
  const R = ROLES[role];
  $('#snav').innerHTML = R.nav.map(([g, items]) => `<div class="sg">${g}</div>${items.map(([k, t, icn, n]) => { const c = n ? n() : 0; return `<a class="sl ${k === page ? 'on' : ''}" href="#${role}/${k}" title="${t}">${ic(icn)}<span>${t}</span>${c ? `<span class="n">${c}</span>` : ''}</a>`; }).join('')}`).join('');
  $('#sbRole').textContent = R.label; $('#roleSel').value = role;
  const [n, r] = R.user; $('#tu').innerHTML = `<span class="av ${role === 'admin' ? '' : 'b'}">${ini(n)}</span><div><b>${n}</b><small>${r}</small></div>`;
  const it = R.nav.flatMap(x => x[1]).find(x => x[0] === page);
  $('#crumb').innerHTML = `<small>${R.label} /</small>${it ? it[1] : ''}`;
  document.title = `${it ? it[1] : ''} · ${R.label} — Imperial Homes`;
}
function render(keepScroll) {
  const fn = PAGES[`${role}/${page}`] || PAGES[`${role}/dashboard`];
  $('#content').innerHTML = fn();
  renderNav();
  requestAnimationFrame(() => setTimeout(() => { $$('.bar').forEach(b => b.style.height = b.dataset.h + '%'); $$('.prog i').forEach(i => i.style.width = i.dataset.w + '%'); }, 120));
  const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
  if (!keepScroll) scrollTo(0, 0);
}
function route() {
  const [r, p] = (location.hash.slice(1) || 'admin/dashboard').split('/');
  role = ROLES[r] ? r : 'admin'; page = p || 'dashboard';
  shell.classList.remove('open'); render();
}
addEventListener('hashchange', route);
$('#roleSel').addEventListener('change', e => location.hash = `${e.target.value}/dashboard`);

/* ================= Top bar ================= */
const tick = () => $('#clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
tick(); setInterval(tick, 15000);
const bell = () => { const u = D.notifs.filter(n => n[2]).length; $('#bellN').textContent = u; $('#bellN').style.display = u ? '' : 'none';
  $('#pop').innerHTML = `<h4>Notifications <button data-readall>Mark all read</button></h4>${D.notifs.map(n => `<span class="nf ${n[2] ? 'u' : ''}">${n[0]}<small>${n[1]}</small></span>`).join('')}`; };
bell();
$('#gsearch').addEventListener('keydown', e => { if (e.key !== 'Enter') return; F.q = e.target.value; if (role === 'admin') { page = 'users'; location.hash = 'admin/users'; render(); } else toast(`Searching “${e.target.value}” across your portal (simulation).`); });

/* ================= Toast & logging ================= */
let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200); };
const log = m => { D.log.unshift([m, 'Just now']); D.notifs.unshift([m, 'Just now', 1]); bell(); };
const done = (m, keep = true) => { toast(m); render(keep); };

/* ================= Review drawer ================= */
const TPL = {Listing:['Please upload a certified copy of the title deed','Photos need higher resolution (min. 3000px wide)','The asking price is above recent comparables in this area','Kindly add floor plans for every level','Please attach a valuation report from a registered valuer'],
  Agent:['Please upload your current EARB practising certificate','Professional indemnity cover is required before approval','We need two client references from the last 24 months'],
  KYC:['Please upload a proof of funds letter from your bank','Kindly complete the source of wealth declaration','Your ID copy is unclear, please upload a clearer scan']};
const qOf = id => D.queue.find(x => x.id === id);
function openRv(id) {
  const q = qOf(id); if (!q) return closeRv();
  q.by = q.by || 'Njeri Mwangi'; q.role = q.role || (q.t === 'Listing' ? 'Seller' : q.t === 'Agent' ? 'Agent applicant' : 'Buyer'); q.msgs = q.msgs || []; q.st = q.st || 'Awaiting Review';
  q.docs = q.docs || [['Title deed (certified copy)', 0], ['Professional photography', 1], ['Floor plans', 0], ['Valuation report', 0]];
  const g = q.g || (q.t === 'Listing' ? [P[0], P[4], P[6]] : null), specs = q.specs || {Location:q.d, Asking:q.p ? usd(q.p) : '—'}, first = q.by.split(' ')[0], ok = q.docs.filter(d => d[1]).length;
  $('#rvd').innerHTML = `<div class="rvh"><span class="pi">${ic(q.t === 'Listing' ? 'home' : q.t === 'Agent' ? 'brief' : 'key')}</span><h3>${q.n}<br><small style="color:var(--ink3);font-weight:600">${q.t} · ${q.id}</small></h3>${pill(q.st)}<button class="ib" data-rvclose aria-label="Close review">${ic('x')}</button></div>
  <div class="rvb">
    ${g ? `<div class="rvg">${g.map(s => `<img src="${I(s)}" alt="">`).join('')}</div>` : ''}
    <div class="li" style="padding:0 0 14px;border:0"><span class="av b">${ini(q.by)}</span><div class="g"><b>${q.by}</b><small>${q.role} · submitted ${q.when || 'today'}</small></div><button class="btn s" data-rvfocus>${ic('msg')}Message</button></div>
    <div class="kvg">${Object.entries(specs).map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>
    ${q.desc ? `<p style="color:var(--ink2);font-size:.9rem">${q.desc}</p>` : ''}
    <div class="h5">Compliance checklist · ${ok}/${q.docs.length} received</div>
    <div class="prog" style="margin:0 0 6px"><i style="width:${Math.round(ok / q.docs.length * 100)}%"></i></div>
    <div>${q.docs.map((d, i) => `<button class="ck ${d[1] ? 'ok' : ''}" data-ck="${i}">` + `<i>${d[1] ? ic('check') : ''}</i>${d[0]}<em>${d[1] ? 'Received' : 'Missing'}</em></button>`).join('')}</div>
    <div class="h5">Advice &amp; messages to ${first}</div>
    <div class="tmpl">${(TPL[q.t] || TPL.Listing).map(t => `<button data-tpl="${t}">${t}</button>`).join('')}</div>
    <div class="rvm" id="rvm">${q.msgs.length ? q.msgs.map(([w, t, tm]) => `<div class="m ${w === 'me' ? 'me' : ''}">${t}<small>${w === 'me' ? 'You' : first} · ${tm}</small></div>`).join('') : `<div class="empty" style="padding:18px">No messages yet. Tell ${first} what is missing or how to strengthen the submission.</div>`}</div>
    <form class="cmp" data-rvsend="${q.id}" style="padding:10px 0 0;border:0"><input name="m" id="rvIn" placeholder="Write advice, a request or a note to ${first}…" aria-label="Message to ${first}" autocomplete="off" required><button class="btn k">${ic('send')}Send</button></form>
  </div>
  <div class="rvf"><button class="btn b" data-apr="${q.id}">${ic('check')}Approve</button><button class="btn" data-rvchg="${q.id}">Request changes</button><button class="btn" data-rej="${q.id}">Reject</button></div>`;
  F.rv = id; document.body.classList.add('rv-open');
  const box = $('#rvm'); box.scrollTop = box.scrollHeight;
}
const closeRv = () => { document.body.classList.remove('rv-open'); F.rv = null; };

/* ================= Actions (simulated) ================= */
document.addEventListener('click', e => {
  if (!e.target.closest('#pop') && !e.target.closest('[data-bell]')) $('#pop').classList.remove('on');
  const t = e.target.closest('button,[data-thread],[data-rvclose],[data-review]'); if (!t) return; const d = t.dataset;
  if (d.review) return openRv(d.review);
  if (d.rvclose !== undefined) return closeRv();
  if (d.rvfocus !== undefined) return $('#rvIn').focus();
  if (d.tpl) { const i = $('#rvIn'); i.value = d.tpl; return i.focus(); }
  if (d.ck) { const q = qOf(F.rv); q.docs[+d.ck][1] = q.docs[+d.ck][1] ? 0 : 1; return openRv(q.id); }
  if (d.rvchg) { const q = qOf(d.rvchg), miss = q.docs.filter(x => !x[1]).map(x => x[0].toLowerCase()); q.st = 'Changes Requested';
    q.msgs.push(['me', 'Thank you for your submission. Before we can approve it we need a few changes' + (miss.length ? ': ' + miss.join(', ') + '.' : '.'), 'Now']); log(`Changes requested · ${q.n}`); toast(`Change request sent to ${q.by}.`); render(true); return openRv(q.id); }
  if (d.bell !== undefined) return $('#pop').classList.toggle('on');
  if (d.readall !== undefined) { D.notifs.forEach(n => n[2] = 0); return bell(); }
  if (d.menu !== undefined) return shell.classList.toggle('open');
  if (d.sclose !== undefined) return shell.classList.remove('open');
  if (d.collapse !== undefined) return shell.classList.toggle('col');
  if (d.tab) { const k = t.parentElement.dataset.tabs; F[k] = d.tab; return render(true); }
  if (d.thread) { F.thread = d.thread; return render(true); }
  if (d.apr || d.rej) { closeRv(); const q = D.queue.find(x => x.id === (d.apr || d.rej)); D.queue = D.queue.filter(x => x !== q);
    if (d.apr && q.t === 'Listing') D.listings.unshift({id:'IH-' + (1100 + D.listings.length), name:q.n, loc:q.d, type:'Estate', price:q.p, beds:9, agent:'a2', status:'Live', img:P[(D.listings.length * 5) % P.length], views:0, enq:0, seller:'s1', listed:'Today'});
    if (d.apr && q.t === 'KYC') { const u = D.users.find(x => x.n === q.n); if (u) u.status = 'Verified'; }
    log(`${q.t} ${d.apr ? 'approved' : 'rejected'} · ${q.n}`); return done(`${q.n} ${d.apr ? 'approved' : 'rejected'}.`); }
  if (d.tog) { const l = L(d.tog); l.status = l.status === 'Suspended' ? 'Live' : 'Suspended'; log(`Listing ${l.status.toLowerCase()} · ${l.name}`); return done(`${l.name} ${l.status === 'Live' ? 'restored' : 'suspended'}.`); }
  if (d.golive) { const l = L(d.golive); l.status = 'Live'; log(`Listing approved · ${l.name}`); return done(`${l.name} is now live in the collection.`); }
  if (d.kyc) { const u = D.users.find(x => x.id === d.kyc); u.status = 'Verified'; D.queue = D.queue.filter(q => q.n !== u.n); log(`Client verified · ${u.n}`); return done(`${u.n} verified.`); }
  if (d.susp) { const u = D.users.find(x => x.id === d.susp); u.status = u.status === 'Suspended' ? 'Verified' : 'Suspended'; log(`Client ${u.status === 'Suspended' ? 'suspended' : 'reinstated'} · ${u.n}`); return done(`${u.n} ${u.status === 'Suspended' ? 'suspended' : 'reinstated'}.`); }
  if (d.conf) { const v = D.viewings.find(x => x.id === d.conf); v.s = 'Confirmed'; log(`Viewing confirmed · ${L(v.l).name}`); return done(`Viewing confirmed for ${v.c}.`); }
  if (d.adv) { const x = D.deals[+d.adv]; x.st++; log(`${x.c} moved to ${['Introduced','Viewing','Negotiation','Closing'][x.st]}`); return done(`${x.c} advanced.`); }
  if (d.close) { const x = D.deals[+d.close]; D.deals = D.deals.filter(y => y !== x); D.deals.forEach((y, i) => y.id = i); const l = L(x.l); l.status = 'Sold';
    D.tx.unshift({id:'TX-' + (90413 + D.tx.length), l:l.name, b:x.c, a:x.v, s:'In Escrow', d:'Today', c:+(x.v * .02).toFixed(2)}); log(`Deal closed · ${l.name} · ${usd(x.v)}`); return done(`Deal closed. ${usd(+(x.v * .02).toFixed(2))} commission projected.`); }
  if (d.acc || d.dec) { const o = D.offers.find(x => x.id === (d.acc || d.dec)); o.s = d.acc ? 'Accepted' : 'Declined'; if (d.acc) L(o.l).status = 'Under Offer'; log(`Offer ${o.s.toLowerCase()} · ${L(o.l).name}`); return done(`Offer ${o.s.toLowerCase()}.`); }
  if (d.save) { D.saved.add(d.save); return done('Added to your shortlist.'); }
  if (d.unsave) { D.saved.delete(d.unsave); return done('Removed from your shortlist.'); }
  if (d.sw) { const on = t.getAttribute('aria-checked') !== 'true'; t.setAttribute('aria-checked', on); return toast(`Setting ${on ? 'enabled' : 'disabled'} (simulation).`); }
  if (d.go) return location.hash = d.go;
  if (d.newdeal !== undefined) { const u = D.users.filter(x => x.role === 'Buyer')[D.deals.length % 7]; const l = D.listings[D.deals.length % D.listings.length]; D.deals.push({id:D.deals.length, c:u.n, l:l.id, v:l.price, st:0}); log(`New deal · ${u.n}`); return done(`${u.n} added to Introduced.`); }
  if (d.export !== undefined) return toast('Export prepared (simulation, no file generated).');
  if (d.invite !== undefined) return toast('Invitation drafted. Sending is disabled in simulation.');
  if (d.upload !== undefined) return toast('Uploads are disabled in simulation.');
  if (d.call !== undefined) return toast('Call request noted. Wambui will be in touch (simulation).');
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.rvsend) { const q = qOf(f.dataset.rvsend), v = f.m.value.trim(); if (!v) return;
    q.msgs.push(['me', v, 'Now']); if (q.st === 'Awaiting Review') q.st = 'Advised'; log(`Advice sent · ${q.n}`); render(true); openRv(q.id); $('#rvIn').focus();
    setTimeout(() => { q.msgs.push(['them', ['Thank you for the guidance. We will update the submission by tomorrow.', 'Noted. I will upload the documents this afternoon.', 'Understood, I will speak to our valuer and revert.'][q.msgs.length % 3], 'Now']); D.notifs.unshift([`${q.by} replied on ${q.n}`, 'Just now', 1]); bell(); if (F.rv === q.id) openRv(q.id); }, 1800);
    return; }
  if (f.dataset.send) { const th = D.threads.find(x => x.id === f.dataset.send), v = f.m.value.trim(); if (!v) return;
    th.m.push(['me', v, 'Now']); render(true);
    setTimeout(() => { th.m.push(['them', 'Thank you. I will attend to this personally and revert shortly.', 'Now']); if (location.hash.includes('messages')) render(true); }, 1400); return; }
  if (f.dataset.newlisting !== undefined) { const x = new FormData(f); D.queue.push({id:'Q' + Date.now(), n:x.get('n'), t:'Listing', d:x.get('c'), p:+x.get('p')}); log(`Listing submitted · ${x.get('n')}`); f.reset(); return toast('Submitted for review. Approve it from the Administration portal.'); }
  if (f.dataset.saveform !== undefined) return toast('Saved (simulation).');
});
addEventListener('click', e => { if (shell.classList.contains('open') && !e.target.closest('.side') && !e.target.closest('[data-menu]')) shell.classList.remove('open'); });
addEventListener('keydown', e => { if (e.key === 'Escape') { closeRv(); shell.classList.remove('open'); $('#pop').classList.remove('on'); } });

route();
})();
</script>
